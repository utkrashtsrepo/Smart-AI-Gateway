name: Gateway CI & Agent Evals

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run Pytest Suite
        run: uv run pytest -v

      - name: Run Agent Evals Benchmark
        run: uv run python evals/run_benchmark.py

      - name: Upload Benchmark Results & Chart
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            evals/results/benchmark_summary.json
            evals/results/benchmark_report.md
            evals/results/cost_vs_accuracy.png

